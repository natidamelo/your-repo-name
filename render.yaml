services:
  - type: web
    name: callcenter-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: callcenter-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: callcenter-db
    plan: free
    region: frankfurt
